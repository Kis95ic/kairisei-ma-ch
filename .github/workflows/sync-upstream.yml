name: Sync upstream main

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Kis95ic/kairisei-ma-ch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync main from the parent repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main
